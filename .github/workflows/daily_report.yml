
name: Daily Seraj Report
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests openai pandas openpyxl jdatetime
      - name: Run script
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python gozaresh.py
