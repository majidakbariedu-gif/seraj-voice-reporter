name: Daily Seraj Report
on:
  schedule:
    - cron: '30 19 * * *'  # معادل ساعت ۲۳:۰۰ (۱۱ شب) به وقت تهران
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests openai pandas openpyxl jdatetime
      - name: Run script
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python gozaresh.py
      - name: Save index state
        run: |
          git config --global user.name "Seraj Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add voices_index.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update processed voices index" && git push)
